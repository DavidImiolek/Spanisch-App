}
@media (prefers-color-scheme: dark){

    --soft:#4A3218; --muted:#DBC59C; --ok:#7FDDA8; --ok-bg:#0F3A28; --bad:#FF9AA8; --bad-bg:#431520;
  }
}
:root[data-theme="dark"]{
  --ground:#2A1A0A; --ink:#FFF1CC; --line:#FFCF1F; --card:#3B2713; --field:#2A1A0A; --word:#FFCF1F;

*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--ground);color:var(--ink);
  font-family:'Karla','Helvetica Neue','Segoe UI',sans-serif;font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
#app{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--ground)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}

.hero{flex-shrink:0;padding-top:env(safe-area-inset-top,0px)}
.hero.tall{padding-top:calc(env(safe-area-inset-top,0px) + 28px)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 20px 0 20px}
.iconbtn{width:44px;height:44px;border:3px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.track{flex:1;height:16px;border:3px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.track i{display:block;height:10px;background:var(--red);transition:width .25s ease}
.count{font-size:16px;font-weight:800;min-width:48px;text-align:right}
.task{margin:18px 26px 0 20px;padding:18px 18px 20px 18px;background:var(--card);border:3px solid var(--line);border-radius:14px;

.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chip{font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{font-weight:800;padding:3px 10px;border-radius:6px;background:var(--line);color:var(--ground)}
.ask{font-size:16px;margin-top:10px}
.word{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:clamp(32px,11vw,46px);line-height:1.05;color:var(--word);overflow-wrap:anywhere}
.word.small{font-size:clamp(24px,7.6vw,32px)}
.sub{font-size:14px;font-weight:600;color:var(--muted)}
.sub.big{font-size:20px;font-weight:800;color:var(--ink)}

.body{padding:22px 26px 24px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
label.lbl{font-size:15px;font-weight:800}
input.ans{height:58px;width:100%;border:3px solid var(--line);border-radius:12px;padding:0 16px;font-family:inherit;
  font-size:20px;font-weight:600;color:var(--ink);background:var(--field)}
input.ans::placeholder{color:var(--muted);opacity:.85;font-weight:400}
.row{display:flex;gap:12px;align-items:stretch}
.btn{min-height:56px;border:3px solid var(--line);border-radius:12px;padding:0 18px;font-size:19px;font-weight:800;background:var(--red);color:#fff;
  box-shadow:4px 4px 0 var(--line);flex:1}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.btn.soft{background:var(--soft);color:var(--ink);font-size:16px;font-weight:600;flex:0 0 auto;box-shadow:none;padding:0 14px}
.btn.soft:active{transform:none}
.btn.wide{flex:none;width:100%}
.btn:disabled{opacity:.5}
.fb{border:3px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.hint{background:var(--card);color:var(--ink)}
.fb b{display:block;font-weight:800}
.fb span{color:var(--ink)}
.fb .muted{color:var(--ink);opacity:.8}
.fb svg{flex-shrink:0;margin-top:2px}
.link{background:none;border:0;padding:10px 0;min-height:44px;color:var(--ink);font-size:15px;font-weight:600;text-decoration:underline;text-align:left}

.card{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:16px}
.card .es{font-size:19px;font-weight:800}
.card .de{color:var(--muted);margin-top:2px}
.h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:clamp(38px,12vw,52px);line-height:1;color:var(--word);margin:0}
.h2{font-size:20px;font-weight:800;margin:6px 0 0 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:3px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat small{font-size:13px;color:var(--muted)}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.plain li{border-bottom:2px solid var(--line);padding-bottom:8px}
ul.plain li:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--card);border:2px solid var(--line);color:var(--ink);margin-left:6px;vertical-align:middle}
.auth-box{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.auth-box input{height:58px;width:100%;border:3px solid var(--line);border-radius:12px;padding:0 16px;font-family:inherit;
  font-size:18px;color:var(--ink);background:var(--field)}
.auth-box input::placeholder{color:var(--muted);opacity:.85}
.install-banner{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.install-banner .title{font-weight:800;font-size:16px}
.install-banner .desc{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.track i{transition:none}.btn:active{transform:none}}
</style>
</head>

function conj(v,t,p){
  if(v[t]) return v[t].split(" ")[p];
  if(t === "fut") return (v.fs || v.inf) + FUT[p];

/* ---------- Session planen ---------- */
function pickOld(n, exclude){
  const pool = Object.keys(S.words).filter(id => WORDS[id] && exclude.indexOf(id) < 0).map(id => ({id, w: 1/Math.pow((S.words[id].s||0)+1, 1.6)}));
  return pickWeighted(pool, n).map(x => x.id);
}
function pickWeighted(pool, n){
  pool = pool.slice(); const out = [];
  while(out.length < n && pool.length){
    let r = Math.random()*pool.reduce((s,x) => s+x.w, 0), i = 0;
    for(; i < pool.length-1; i++){ r -= pool[i].w; if(r <= 0) break; }
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
function nextPack(){ return PACKS.find(p => S.packs.indexOf(p.id) < 0) || null; }
const nextType = () => SEQ[(S.qi||0) % SEQ.length];
function blank(type, area, title){ return {type, area, title, phase: FLOW[type][0], i:0, news:[], olds:[], sents:[], errors:{}, labels:{}, first:0, firstOk:0, done:0, total:0, start:Date.now(), elapsed:0}; }
function planSession(){
  const t = nextType(), X = t === "k" ? planConj() : t === "z" ? planTense() : planVocab();
  return X;
}
function planVocab(){
  const pack = nextPack(), X = blank("v", pack ? pack.area : "Wiederholung", pack ? pack.title : "Alte Wörter");
  X.packId = pack ? pack.id : null;
  X.news = pack ? pack.words.map(a => a[0]) : [];
  X.olds = pickOld(pack ? 5 : 15, X.news);
  const half = Math.ceil(X.olds.length/2);
  X.q1 = shuffle(X.news.concat(X.olds.slice(0,half))).map(id => ({id, dir:"es"}));
  X.q2 = shuffle(X.news.concat(X.olds.slice(half))).map(id => ({id, dir:"de"}));
  const pool = X.news.length ? shuffle(X.news) : X.olds.slice().sort((a,b) => (S.words[a].s||0)-(S.words[b].s||0));
  X.sents = pool.slice(0,5).map(id => { const w = WORDS[id]; return {ask:"Schreib einen Satz mit:", word:w.es, sub:w.de, label:w.es, ctx:"Der Satz soll das Wort «"+w.es+"» ("+w.de+") sinnvoll verwenden.", ex:w.exEs, text:""}; });
  X.total = X.news.length + X.q1.length + X.q2.length + X.sents.length;
  return X;
}
function planConj(){
  const X = blank("k", "Verbformen", "25 Formen"), cands = [];
  VERBS.forEach((v,vi) => TENSES.forEach(tt => { const w = (irregular(v,tt[0]) ? 3 : 1) + 2*((S.conj||{})[v.inf+":"+tt[0]]||0); for(let p = 0; p < 6; p++) cands.push({k:[vi,tt[0],p], w}); }));
  X.olds = pickOld(5, []);
  X.warm = shuffle(X.olds).map((id,ix) => ({id, dir: ix % 2 ? "de" : "es"}));
  X.conj = pickWeighted(cands, 25).map(c => ({k:c.k}));
  X.total = X.warm.length + X.conj.length;
  return X;
}
function planTense(){
  const ti = (S.zi||0) % TOPICS.length, T = TOPICS[ti], X = blank("z", "Lückensätze", T.title);
  X.topic = ti;
  X.gaps = shuffle(T.gaps.map((g,gi) => ({g:[ti,gi]})));
  X.sents = T.free.map(f => ({ask:"Schreib einen Satz:", word:f.word, sub:"", card:f.card, label:f.word, ctx:"Thema: "+T.title+". Aufgabe: "+f.card, ex:f.ex, text:""}));
  X.total = 1 + X.gaps.length + X.sents.length;
  return X;
}

function loginScreen(){

      if(!token || token.length < 6){ msg.textContent = "Bitte den 6-stelligen Code eingeben."; return; }
      msg.textContent = "Wird geprüft ...";

      if(error){ msg.textContent = "Fehler: " + error.message; return; }
      msg.textContent = "Angemeldet!";
    }
  };
  emailInput.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); btn.click(); } });
  codeInput.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); btn.click(); } });
  show(hr, h("div",{class:"body"},
    h("div",{class:"auth-box"}, emailInput, codeInput, btn, msg),
    h("button",{class:"link",text:"Erstmal ohne Konto weiter",onclick: () => { home(); }})));
}

/* ---------- Push-Benachrichtigungen ---------- */
async function subscribePush(){
  try{
    const perm = await Notification.requestPermission();
    if(perm !== "granted") return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
    });
    if(currentUser){
      await sb.from("push_subscriptions").upsert({
        user_id: currentUser.id,
        subscription: sub.toJSON(),
        updated_at: new Date().toISOString()
      }, { onConflict: "user_id" });
    }
  }catch(e){ console.error("Push subscription failed:", e); }
}
function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

}
function desc(item){
  if(item.k){
    const v = VERBS[item.k[0]], t = item.k[1], p = item.k[2], tn = TENSES.find(x => x[0] === t)[1], sol = conj(v,t,p);
    return {chip:"Konjugieren", ask:tn, word:v.inf, sub:PERS[p], bigSub:true, ph:"Form eintippen", key:"k:"+v.inf+":"+t, label:v.inf + ", " + tn + ", " + PERS[p] + ": " + sol,
      solution:sol, note:"", check: val => esKey(sol) === stripPron(val) ? "ok" : "bad"};
  }
  if(item.g){
    const T = TOPICS[item.g[0]], g = T.gaps[item.g[1]];
    return {chip:"Zeiten", ask:"Setz die richtige Form ein:", word:g[3], sub:g[2], bigSub:true, card:gapText(g), ph:"fehlende Form eintippen", key:"g:"+item.g[0]+":"+item.g[1],
      label:(t => t.charAt(0).toUpperCase() + t.slice(1))(gapText(g).replace("_____", g[4][0])), solution:g[4].join(" oder "), note:g[5], always:true,
      check: val => g[4].some(a => esKey(a) === stripPron(val) || esKey(a) === esKey(val)) ? "ok" : "bad"};
  }
  const w = WORDS[item.id], toDe = item.dir === "es", isOld = X.olds.indexOf(item.id) >= 0;
  return {chip: isOld ? "Wiederholung" : "Vokabeln", ask: toDe ? "Was heißt das auf Deutsch?" : "Wie heißt das auf Spanisch?", word: toDe ? w.es : w.de,
    sub: toDe ? w.type : w.type + (w.type.indexOf("Substantiv") === 0 ? ", mit Artikel" : ""), ph: toDe ? "auf Deutsch eintippen" : "auf Spanisch eintippen",
    key:item.id, label:w.es + " – " + w.de, solution: toDe ? w.de + (w.deAlt.length ? " (auch: " + w.deAlt.slice(0,3).join(", ") + ")" : "") : w.es,
    note:w.note, override:true, check: val => toDe ? checkDe(w,val) : checkEs(w,val)};
}
function ask(queue){
  const item = queue[X.i], d = desc(item), hr = hero(false);
  hr.append(topBar(), taskBlock(d.chip, d.ask, d.word, d.sub, d.bigSub ? false : undefined));
  const input = h("input",{class:"ans",id:"ans",type:"text",autocomplete:"off",autocapitalize:"off",autocorrect:"off",spellcheck:"false",enterkeyhint:"done",placeholder:d.ph});
  const fb = h("div",{"aria-live":"polite"}), actions = h("div",{class:"row"});
  let state = "ask";
  const settle = (ok) => {
    if(!item.retry){ X.first++; if(ok) X.firstOk++; }
    if(ok){ X.done++; }
    else { X.errors[d.key] = (X.errors[d.key]||0) + 1; X.labels[d.key] = d.label; queue.splice(Math.min(X.i+4, queue.length), 0, Object.assign({}, item, {retry:true})); }
  };
  const next = () => { X.i++; step(); };
  const same = q => q.retry && JSON.stringify([q.id,q.dir,q.k,q.g]) === JSON.stringify([item.id,item.dir,item.k,item.g]);
  const reveal = (ok, mine) => {
    state = "fb";
    fb.replaceChildren(h("div",{class:"fb " + (ok ? "ok" : "bad")}, icon(ok ? I_OK : I_X),
      h("div",{}, h("b",{text: ok ? "Richtig" : "Nicht ganz"}), h("span",{text: (ok ? "" : "Richtig wäre: ") + d.solution}),
        d.note && (d.always || !ok) ? h("div",{class:"muted",text:d.note}) : null)));
    actions.replaceChildren(h("button",{class:"btn",text:"Weiter",onclick: next}),
      (!ok && mine && d.override) ? h("button",{class:"btn soft",text:"War doch richtig",onclick: () => {
        X.errors[d.key] = Math.max(0,(X.errors[d.key]||1)-1); if(!X.errors[d.key]){ delete X.errors[d.key]; delete X.labels[d.key]; }
        const k = queue.findIndex((q,ix) => ix > X.i && same(q)); if(k >= 0) queue.splice(k,1);
        if(!item.retry) X.firstOk++; X.done++; next(); }}) : null);
  };
  const check = () => {
    const val = input.value.trim(); if(!val){ input.focus(); return; }
    const r = d.check(val);
    if(r === "article"){ fb.replaceChildren(h("div",{class:"fb hint"}, icon(I_INFO), h("div",{}, h("b",{text:"Fast: der Artikel fehlt"}), h("span",{text:"Tipp das Wort noch einmal mit el oder la."})))); input.focus(); return; }
    settle(r === "ok"); reveal(r === "ok", true);
  };
  const giveUp = () => { if(state !== "ask") return; settle(false); reveal(false, false); };
  input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); state === "ask" ? check() : next(); } });
  input.addEventListener("beforeinput", e => { if(state === "fb") e.preventDefault(); });
  actions.append(h("button",{class:"btn",text:"Prüfen",onclick: () => { if(state === "ask") check(); }}), h("button",{class:"btn soft",text:"Weiß ich nicht",onclick: giveUp}));
  show(hr, h("div",{class:"body"}, d.card ? h("div",{class:"card"}, h("div",{class:"es",text:d.card})) : null,
    h("label",{class:"lbl",for:"ans",text:"Deine Antwort"}), input, fb, actions));
  input.focus({preventScroll:true});
}
function sentence(){
  const s = X.sents[X.i], hr = hero(false);
  hr.append(topBar(), taskBlock("Satz " + (X.i+1) + " von " + X.sents.length, s.ask, s.word, s.sub));
  const input = h("input",{class:"ans",id:"ans",type:"text",autocomplete:"off",autocapitalize:"sentences",autocorrect:"off",spellcheck:"false",enterkeyhint:"done",placeholder:"dein spanischer Satz"});
  const go = (skip) => { const v = input.value.trim(); if(!skip && !v){ input.focus(); return; } s.text = skip ? "" : v; X.i++; X.done++; step(); };
  input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); go(false); } });
  show(hr, h("div",{class:"body"}, s.card ? h("div",{class:"card"}, h("div",{class:"es",text:s.card})) : null,
    h("label",{class:"lbl",for:"ans",text:"Dein Satz"}), input,
    h("div",{class:"muted",text:"Die Sätze werden am Ende gemeinsam korrigiert."}),
    h("div",{class:"row"}, h("button",{class:"btn",text:"Weiter",onclick: () => go(false)}), h("button",{class:"btn soft",text:"Überspringen",onclick: () => go(true)}))));
  input.focus({preventScroll:true});
}

/* ---------- Abschluss ---------- */
function finish(){
  view = "done";
  X.elapsed += Date.now() - X.start;
  const t = today();
  X.news.forEach(id => { S.words[id] = {s: X.errors[id] ? 1 : 2, d: t}; });
  X.olds.forEach(id => { const cur = S.words[id] || {s:0}; S.words[id] = {s: X.errors[id] ? Math.max(0, cur.s-2) : Math.min(5, cur.s+1), d: t}; });
  if(X.packId && S.packs.indexOf(X.packId) < 0) S.packs.push(X.packId);
  if(X.type === "k"){
    S.conj = S.conj || {};
    X.conj.forEach(it => { if(it.retry) return; const key = VERBS[it.k[0]].inf + ":" + it.k[1];
      if(X.errors["k:"+key]) S.conj[key] = Math.min(5, (S.conj[key]||0) + 1); else if(S.conj[key]){ S.conj[key]--; if(!S.conj[key]) delete S.conj[key]; } });
  }
  if(X.type === "z"){ S.zi = (S.zi||0) + 1; S.zstat = S.zstat || {}; const z = S.zstat[X.topic] || {n:0, ok:0}; z.n += X.first; z.ok += X.firstOk; S.zstat[X.topic] = z; }
  S.qi = (S.qi||0) + 1;
  if(S.lastDay !== t){ S.streak = (S.lastDay === dayBefore(t)) ? S.streak + 1 : 1; S.lastDay = t; }
  S.sessions++; persist(); lsSet(LS_SESS, null);
  const sess = X; X = null;
  const mins = Math.max(1, Math.round(sess.elapsed/60000)), rate = sess.first ? Math.round(100*sess.firstOk/sess.first) : 100;
  const shaky = Object.keys(sess.errors);
  const hr = hero(true);
  hr.append(h("div",{class:"task"}, h("p",{class:"h1",text:"¡Hecho!"}), h("div",{class:"sub",text:"Session abgeschlossen."})));
  const sentBox = h("div",{});
  show(hr, h("div",{class:"body"},
    h("div",{class:"stats"},
      h("div",{class:"stat"}, h("b",{text: rate + " %"}), h("small",{text:"beim ersten Versuch"})),
      h("div",{class:"stat"}, h("b",{text: mins + " min"}), h("small",{text:"Dauer"})),
      h("div",{class:"stat"}, h("b",{text:String(S.streak)}), h("small",{text: S.streak === 1 ? "Tag in Folge" : "Tage in Folge"}))),
    shaky.length ? h("p",{class:"h2",text:"Noch wackelig"}) : null,
    shaky.length ? h("ul",{class:"plain"}, ...shaky.map(k => h("li",{text: sess.labels[k] || k}))) : h("div",{class:"muted",text:"Kein einziger Fehler. Alles saß."}),
    sentBox,
    h("button",{class:"btn wide",text:"Noch eine Session",onclick: () => { X = planSession(); step(); }}),
    h("button",{class:"btn soft wide",text:"Zur Startseite",onclick: home})));
  reviewSentences(sess, sentBox);
}

/* ---------- Satzkorrektur über OpenAI Edge Function ---------- */
async function reviewSentences(sess, box){
  const items = sess.sents.filter(s => s.text); if(!items.length) return;
  const list = h("ul",{class:"plain"});
  items.forEach(s => { s.row = h("div",{class:"muted",text:"wird korrigiert …"}); list.append(h("li",{}, h("div",{}, h("b",{text:s.label}), ": " + s.text), s.row)); });
  box.append(h("p",{class:"h2",text:"Deine Sätze"}), list);
  const fallback = () => items.forEach(s => { s.row.textContent = "Zum Vergleich: " + s.ex; });

  // Try Supabase Edge Function (OpenAI)
  if(currentUser){
    try{
      const { data: { session: authSession } } = await sb.auth.getSession();
      if(authSession){
        const entries = items.map((s,i) => ({i, aufgabe:s.ctx, satz:s.text}));
        const res = await fetch(SB_URL + "/functions/v1/openai-proxy", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authSession.access_token, "apikey": SB_KEY },
          body: JSON.stringify({ action: "correct", payload: { entries } })
        });
        if(res.ok){
          const json = await res.json();
          const arr = (json && json.results) || [];
          items.forEach((s,i) => {
            const r = arr.find(x => x && x.i === i); if(!r){ s.row.textContent = "Zum Vergleich: " + s.ex; return; }
            s.row.replaceChildren(h("div",{class:"fb " + (r.ok ? "ok" : "bad"),style:"margin-top:6px"}, icon(r.ok ? I_OK : I_X),
              h("div",{}, h("b",{text: r.ok ? "Passt" : "Besser so"}), r.ok ? null : h("span",{text:String(r.korrektur || "")}), r.hinweis ? h("div",{class:"muted",text:String(r.hinweis)}) : null)));
          });
          return;
        }
      }
    }catch(e){ console.error("Correction error:", e); }
  }
  // Fallback: show example sentences
  box.append(h("div",{class:"muted",text:"Korrektur nur mit Konto verfügbar. Vergleich deine Sätze mit den Beispielen."}));
  fallback();
}

/* ---------- Init ---------- */
async function init(){
  // Register service worker
  if("serviceWorker" in navigator){
    try{ await navigator.serviceWorker.register("sw.js"); }catch(e){}
  }

  // Check auth state
  const { data: { session } } = await sb.auth.getSession();
  if(session){ currentUser = session.user; await syncFromCloud(); }

  // Listen for auth changes (magic link callback)
  sb.auth.onAuthStateChange(async (event, session) => {
    if(event === "SIGNED_IN" && session){
      currentUser = session.user;
      await syncFromCloud();
      // Auto-subscribe to push after login
      if("PushManager" in window && Notification.permission === "default"){
        // Don't auto-ask, let them do it from settings
      }
      home();
    }
    if(event === "SIGNED_OUT"){ currentUser = null; }
  });

  home();
}
init();
