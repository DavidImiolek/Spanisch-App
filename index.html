<style>
:root{
  --ground:#FFCF1F; --ink:#2B1608; --line:#2B1608; --card:#FFFFFF; --field:#FFFFFF; --red:#D7261E; --word:#D7261E;
  --soft:#FFE98A; --muted:#5A3A22; --ok:#12693E; --ok-bg:#E3F4EA; --bad:#A30D25; --bad-bg:#FBE7EA;
  box-sizing:border-box; padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#2A1A0A; --ink:#FFF1CC; --line:#FFCF1F; --card:#3B2713; --field:#2A1A0A; --word:#FFCF1F;
    --soft:#4A3218; --muted:#DBC59C; --ok:#7FDDA8; --ok-bg:#0F3A28; --bad:#FF9AA8; --bad-bg:#431520;
  }
}
:root[data-theme="dark"]{
  --ground:#2A1A0A; --ink:#FFF1CC; --line:#FFCF1F; --card:#3B2713; --field:#2A1A0A; --word:#FFCF1F;
  --soft:#4A3218; --muted:#DBC59C; --ok:#7FDDA8; --ok-bg:#0F3A28; --bad:#FF9AA8; --bad-bg:#431520;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--ground);color:var(--ink);
  font-family:'Karla','Helvetica Neue','Segoe UI',sans-serif;font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
#app{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--ground)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}

.hero{flex-shrink:0;padding-top:env(safe-area-inset-top,0px)}
.hero.tall{padding-top:calc(env(safe-area-inset-top,0px) + 28px)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 20px 0 20px}
.iconbtn{width:44px;height:44px;border:3px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.track{flex:1;height:16px;border:3px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.track i{display:block;height:10px;background:var(--red);transition:width .25s ease}
.count{font-size:16px;font-weight:800;min-width:48px;text-align:right}
.task{margin:18px 26px 0 20px;padding:18px 18px 20px 18px;background:var(--card);border:3px solid var(--line);border-radius:14px;
  box-shadow:6px 6px 0 var(--line);display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chip{font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{font-weight:800;padding:3px 10px;border-radius:6px;background:var(--line);color:var(--ground)}
.ask{font-size:16px;margin-top:10px}
.word{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:clamp(32px,11vw,46px);line-height:1.05;color:var(--word);overflow-wrap:anywhere}
.word.small{font-size:clamp(24px,7.6vw,32px)}
.sub{font-size:14px;font-weight:600;color:var(--muted)}
.sub.big{font-size:20px;font-weight:800;color:var(--ink)}

.body{padding:22px 26px 24px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
label.lbl{font-size:15px;font-weight:800}
input.ans{height:58px;width:100%;border:3px solid var(--line);border-radius:12px;padding:0 16px;font-family:inherit;
  font-size:20px;font-weight:600;color:var(--ink);background:var(--field)}
input.ans::placeholder{color:var(--muted);opacity:.85;font-weight:400}
.row{display:flex;gap:12px;align-items:stretch}
.btn{min-height:56px;border:3px solid var(--line);border-radius:12px;padding:0 18px;font-size:19px;font-weight:800;background:var(--red);color:#fff;
  box-shadow:4px 4px 0 var(--line);flex:1}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.btn.soft{background:var(--soft);color:var(--ink);font-size:16px;font-weight:600;flex:0 0 auto;box-shadow:none;padding:0 14px}
.btn.soft:active{transform:none}
.btn.wide{flex:none;width:100%}
.btn:disabled{opacity:.5}
.fb{border:3px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.hint{background:var(--card);color:var(--ink)}
.fb b{display:block;font-weight:800}
.fb span{color:var(--ink)}
.fb .muted{color:var(--ink);opacity:.8}
.fb svg{flex-shrink:0;margin-top:2px}
.link{background:none;border:0;padding:10px 0;min-height:44px;color:var(--ink);font-size:15px;font-weight:600;text-decoration:underline;text-align:left}

.card{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:16px}
.card .es{font-size:19px;font-weight:800}
.card .de{color:var(--muted);margin-top:2px}
.h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:clamp(38px,12vw,52px);line-height:1;color:var(--word);margin:0}
.h2{font-size:20px;font-weight:800;margin:6px 0 0 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:3px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat small{font-size:13px;color:var(--muted)}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.plain li{border-bottom:2px solid var(--line);padding-bottom:8px}
ul.plain li:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--card);border:2px solid var(--line);color:var(--ink);margin-left:6px;vertical-align:middle}
.auth-box{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.auth-box input{height:58px;width:100%;border:3px solid var(--line);border-radius:12px;padding:0 16px;font-family:inherit;
  font-size:18px;color:var(--ink);background:var(--field)}
.auth-box input::placeholder{color:var(--muted);opacity:.85}
.install-banner{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.install-banner .title{font-weight:800;font-size:16px}
.install-banner .desc{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.track i{transition:none}.btn:active{transform:none}}
.banner{color:#fff;border-color:var(--line)}
.banner .h1{color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.35)}
.banner .sub{color:#fff;opacity:.95}
.banner .chip{color:#fff}
.banner .chip.on{background:#fff;color:#222}
.bubble{position:relative;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px 16px;font-size:18px;font-weight:600}
.mini{display:flex;align-items:center;justify-content:space-between;gap:0;padding:6px 4px}
.mini .dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);background:#9b9b9b;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
.mini .dot.done{background:#F2B705;color:#2B1608}
.mini .dot.cur{background:var(--red);animation:pulse 1.4s infinite}
.mini .ln{flex:1;border-top:4px dotted var(--line);opacity:.6;margin:0 2px}
.mapscreen{flex:1;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 18px 14px;gap:10px;color:#fff;min-height:100vh}
.maphead{display:flex;align-items:center;gap:8px}
.maphead .t{flex:1;text-align:center}
.maphead .t b{display:block;font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:26px;line-height:1.1;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.maphead .t small{font-size:13px;font-weight:600;opacity:.95}
.mapscreen .iconbtn{background:rgba(255,255,255,.9);color:#2B1608;border-color:#2B1608}
.mapscreen .iconbtn:disabled{opacity:.35}
.field{position:relative;height:620px;border:3px solid rgba(0,0,0,.55);border-radius:16px;background:rgba(255,255,255,.14);overflow:hidden}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.field line{stroke:rgba(255,255,255,.9);stroke-width:5;stroke-dasharray:2 12;stroke-linecap:round;vector-effect:non-scaling-stroke}
.field line.done{stroke:#FFD93B}
.node{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;width:120px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff}
.node .c{position:relative;width:60px;height:60px;display:flex;align-items:center;justify-content:center}
.node .c svg.stico{width:60px;height:60px;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.35))}
.node.lock .c svg.stico{opacity:.55;filter:grayscale(.6) drop-shadow(1px 2px 2px rgba(0,0,0,.35))}
.node .badge{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2px solid #2B1608;z-index:2}
.node.done .badge{background:#F2B705;color:#2B1608}
.node.lock .badge{background:#8a8a8a;color:#fff}
.node.cur .c{animation:pulse 1.4s infinite;border-radius:50%}
.node.lock{opacity:.8}
.node.sel .c{outline:4px solid #fff;outline-offset:2px;border-radius:12px}
.node .n{font-size:13px;font-weight:800;line-height:1.1;text-shadow:1px 1px 0 rgba(0,0,0,.6);text-align:center}
.node .k{font-size:11px;font-weight:600;opacity:.9;text-shadow:1px 1px 0 rgba(0,0,0,.6)}
.char{position:absolute;transform:translate(-50%,-92%);font-size:34px;line-height:1;pointer-events:none;transition:left 1.6s ease-in-out,top 1.6s ease-in-out,opacity .6s;z-index:3;animation:bob .8s infinite alternate}
.panel{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.panel b{font-size:19px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);color:var(--ink);border:3px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px) 18px;display:flex;flex-direction:column;gap:10px}
table.rt{border-collapse:collapse;width:100%;background:var(--card);border:3px solid var(--line);font-size:16px}
table.rt th,table.rt td{border:2px solid var(--line);padding:6px 6px;text-align:left}
table.rt th{background:var(--soft);font-size:14px}
table.rt td b{color:var(--red);font-weight:800}
.irr-row{padding:6px 0;border-bottom:2px solid var(--line);font-size:15px}
.irr-row b{margin-right:4px}
.irr-row:last-child{border-bottom:0}
.rtxt{font-size:16px;margin:0}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(215,38,30,.8)}70%{box-shadow:0 0 0 14px rgba(215,38,30,0)}100%{box-shadow:0 0 0 0 rgba(215,38,30,0)}}
@keyframes bob{from{margin-top:0}to{margin-top:-6px}}
@media (prefers-reduced-motion: reduce){.mini .dot.cur,.node.cur .c,.char{animation:none}.char{transition:none}}
</style>
</head>

const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const base = s => s.toLowerCase().replace(/ß/g,"ss").replace(/[.,;:!?¡¿'"´`''""()\[\]\-–—\/]/g," ").replace(/\s+/g," ").trim();
const deCore = s => base(s).replace(/^(der|die|das|ein|eine|einen|einem|den|dem) /,"").replace(/^(sich|zu|etwas) /,"");
function deKeys(s){ const c = deCore(s); return [strip(c.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")), strip(c)]; }
const esKey = s => strip(base(s));
const esNoArt = s => esKey(s).replace(/^(el|la|los|las|un|una) /,"");
function checkDe(w, input){
  const ok = new Set(); [w.de].concat(w.deAlt).forEach(a => deKeys(a).forEach(k => ok.add(k)));
  return deKeys(input).some(k => k && ok.has(k)) ? "ok" : "bad";
}
function checkEs(w, input){
  const all = [w.es].concat(w.esAlt), k = esKey(input);
  if(!k) return "bad";
  if(all.some(a => esKey(a) === k)) return "ok";
  if(all.some(a => esKey(a) !== esNoArt(a) && esNoArt(a) === k)) return "article";
  return "bad";
}

async function syncFromCloud(){
  if(!currentUser) return;
  try{
    const { data } = await sb.from("progress").select("data").eq("user_id", currentUser.id).maybeSingle();
    if(data && data.data && (data.data.updated || 0) > (S.updated || 0)){
      S = Object.assign(fresh(), data.data);
      lsSet(LS, S);
      if(view === "home") home();
    }
  }catch(e){}
}
async function persist(){
  S.updated = Date.now(); lsSet(LS, S);
  if(!currentUser) return;
  try{
    await sb.from("progress").upsert({ user_id: currentUser.id, data: S, updated_at: new Date().toISOString() }, { onConflict: "user_id" });
  }catch(e){}
}

    else if(k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);

  for(let i = 2; i < arguments.length; i++){ const c = arguments[i]; if(c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(c)); }

}

/* ---------- Session planen ---------- */
function pickOld(n, exclude){
  const pool = Object.keys(S.words).filter(id => WORDS[id] && exclude.indexOf(id) < 0).map(id => ({id, w: 1/Math.pow((S.words[id].s||0)+1, 1.6)}));
  return pickWeighted(pool, n).map(x => x.id);
}
function pickWeighted(pool, n){
  pool = pool.slice(); const out = [];
  while(out.length < n && pool.length){
    let r = Math.random()*pool.reduce((s,x) => s+x.w, 0), i = 0;
    for(; i < pool.length-1; i++){ r -= pool[i].w; if(r <= 0) break; }
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
const packById = id => PACKS.find(p => p.id === id) || null;
const curStation = () => STATIONS[S.station] || STATIONS[0];
const tenseName = t => (TENSES.find(x => x[0] === t) || [0,t])[1];
function savedSess(){ const s = lsGet(LS_SESS); return (s && s.station === S.station && (s.round||0) === (S.round||0)) ? s : null; }
function blank(type, area, title){ return {type, area, title, phase: FLOW[type][0], i:0, news:[], olds:[], sents:[], errors:{}, labels:{}, first:0, firstOk:0, done:0, total:0, start:Date.now(), elapsed:0}; }
function planSession(){
  const st = curStation(), Y = st.type === "k" ? planConj(st) : planVocab(st);
  Y.station = S.station; Y.round = S.round||0;
  return Y;
}
function planVocab(st){
  const rd = S.round||0, known = Object.keys(S.words).filter(id => WORDS[id]).length;
  const pack = (rd > 0 && known >= 5) ? null : packById(st.pack);
  const Y = blank("v", pack ? pack.area : "Wiederholung", pack ? pack.title : st.name);
  Y.packId = pack ? pack.id : null;
  Y.news = pack ? pack.words.map(a => a[0]) : [];
  Y.olds = pickOld(pack ? 5 : 15, Y.news);
  const half = Math.ceil(Y.olds.length/2);
  Y.q1 = shuffle(Y.news.concat(Y.olds.slice(0,half))).map(id => ({id, dir:"es"}));
  Y.q2 = shuffle(Y.news.concat(Y.olds.slice(half))).map(id => ({id, dir:"de"}));
  const pool = Y.news.length ? shuffle(Y.news) : Y.olds.slice().sort((a,b) => (S.words[a].s||0)-(S.words[b].s||0));
  Y.sents = pool.slice(0,5).map(id => { const w = WORDS[id]; return {ask:"Schreib einen Satz mit:", word:w.es, sub:w.de, label:w.es, ctx:"Der Satz soll das Wort «"+w.es+"» ("+w.de+") sinnvoll verwenden.", ex:w.exEs, text:""}; });
  Y.total = Y.news.length + Y.q1.length + Y.q2.length + Y.sents.length;
  return Y;
}
function planConj(st){
  const rd = S.round||0, t0 = st.tense, all = VERBS.map((v,i) => i);
  const Y = blank("k", tenseName(t0), tenseName(t0) + (rd > 0 ? ", alle Verben" : st.regular ? ", regelmäßig" : ", unregelmäßig"));
  Y.tense = t0; Y.regular = !!st.regular;
  const tl = rd > 0 ? TENSES.slice(0, TENSES.findIndex(x => x[0] === t0) + 1).map(x => x[0]) : [t0];
  const idx = rd > 0 ? all : st.regular ? [0,1,2] : all.filter(i => i >= 3 && irregular(VERBS[i], t0));
  const cands = [];
  idx.forEach(vi => tl.forEach(t => { const v = VERBS[vi];
    const w = ((irregular(v,t) ? 3 : 1) + 2*((S.conj||{})[v.inf+":"+t]||0)) * (t === t0 ? 2 : 1) * (rd > 0 && irregular(v,t) ? 2 : 1);
    for(let p = 0; p < 6; p++) cands.push({k:[vi,t,p], w}); }));
  Y.olds = pickOld(5, []);
  Y.warm = shuffle(Y.olds).map((id,ix) => ({id, dir: ix % 2 ? "de" : "es"}));
  let pk = pickWeighted(cands, 25);
  while(pk.length < 25) pk = pk.concat(pickWeighted(cands, 25 - pk.length));
  Y.conj = pk.map(c => ({k:c.k}));
  Y.total = Y.warm.length + Y.conj.length;
  return Y;
}

function worldMap(wi, opts){
  opts = opts || {}; view = "map";
  const adv = opts.advance, W = WORLDS[wi], cw = Math.floor(S.station / 7);
  const maxW = (opts.allDone || (adv && adv.wrap)) ? 3 : cw;
  const charG = adv ? adv.from : S.station;
  const nodesDone = adv && adv.wrap;
  const field = h("div",{class:"field"});
  const sv = h("div");
  let lines = "";
  for(let j = 0; j < 6; j++){
    const g = wi*7 + j, done = nodeState(g, nodesDone) === "done";
    lines += '<line class="' + (done ? "done" : "") + '" x1="' + POS[j][0] + '" y1="' + POS[j][1] + '" x2="' + POS[j+1][0] + '" y2="' + POS[j+1][1] + '"></line>';
  }
  sv.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' + lines + '</svg>';
  field.append(sv.firstChild);
  const panel = h("div",{class:"panel"});
  const nodeEls = [];
  const select = g => {
    const st = STATIONS[g], s = nodeState(g, nodesDone);
    nodeEls.forEach((e,j) => e.classList.toggle("sel", wi*7 + j === g));
    panel.replaceChildren(h("b",{text:st.name}),
      h("div",{class:"muted",text: "Station " + (g+1) + " von " + NST + ", " + kindTxt(st)}),
      h("div",{text: s === "lock" ? "Noch gesperrt. Schließe erst die Stationen davor ab." : st.desc}),
      (!adv && s === "cur") ? h("button",{class:"btn wide",text:"Station starten",onclick: startStation}) : null,
      s === "done" ? h("div",{class:"muted",text:"Geschafft!"}) : null);
  };
  for(let j = 0; j < 7; j++){
    const g = wi*7 + j, st = STATIONS[g], s = nodeState(g, nodesDone);
    const cWrap = h("span",{class:"c"});
    cWrap.innerHTML = stationIcon(g);
    if(s === "done") cWrap.append(h("span",{class:"badge",text:"✓"}));
    else if(s === "lock") cWrap.append(h("span",{class:"badge",text:"🔒"}));
    else if(s === "cur") cWrap.append(h("span",{class:"badge",style:"background:#D7261E;color:#fff",text:String(g % 7 + 1)}));
    const el = h("button",{class:"node " + s, style:"left:" + POS[j][0] + "%;top:" + POS[j][1] + "%", "aria-label": st.name + ", " + (s === "done" ? "geschafft" : s === "cur" ? "aktuell" : "gesperrt"), onclick: () => select(g)},
      cWrap,
      h("span",{class:"n",text:st.name}), h("span",{class:"k",text: st.type === "k" ? "Verben" : "Vokabeln"}));
    nodeEls.push(el); field.append(el);
  }
  let ch = null;
  if(Math.floor(charG / 7) === wi){
    const p = POS[charG % 7];
    ch = h("div",{class:"char",text:"🚶",style:"left:" + p[0] + "%;top:" + p[1] + "%"});
    field.append(ch);
  }
  const prev = h("button",{class:"iconbtn","aria-label":"Vorherige Welt",text:"<",disabled: !!adv || wi <= 0, onclick: () => worldMap(wi-1, opts)});
  const next = h("button",{class:"iconbtn","aria-label":"Nächste Welt",text:">",disabled: !!adv || wi >= maxW, onclick: () => worldMap(wi+1, opts)});
  const back = h("button",{class:"iconbtn","aria-label":"Zurück",onclick: home}, icon(I_X));
  const head = h("div",{class:"maphead"}, adv ? h("div",{style:"width:44px"}) : back, prev,
    h("div",{class:"t"}, h("b",{text: W.emoji + " " + W.name}), h("small",{text: W.desc})), next);
  const foot = [];
  if(adv){
    const msg = adv.wrap ? "Alle " + NST + " Stationen geschafft! Runde " + ((S.round||0)+1) + " beginnt: gleiche Orte, neue Herausforderung." :
      adv.newWorld ? "Neue Welt freigeschaltet: " + WORLDS[STATIONS[adv.to].world].name + "!" : "Weiter zu: " + STATIONS[adv.to].name;
    foot.push(h("div",{class:"panel"}, h("b",{text:"Station geschafft!"}), h("div",{text:msg})),
      h("button",{class:"btn wide",text:"Weiter",onclick: opts.onDone}));
    setTimeout(() => {
      if(!ch) return;
      if(adv.wrap || adv.newWorld){ ch.style.left = "50%"; ch.style.top = "104%"; ch.style.opacity = "0"; }
      else { const p = POS[adv.to % 7]; ch.style.left = p[0] + "%"; ch.style.top = p[1] + "%"; }
    }, 500);
  } else {
    foot.push(panel, h("button",{class:"btn soft wide",style:"background:rgba(255,255,255,.9)",text:"Zur Startseite",onclick: home}));
  }
  const scr = h("div",{class:"mapscreen",style:"background:" + W.bg}, head, field, ...foot);
  show(scr);
  if(!adv) select(Math.floor(S.station / 7) === wi ? S.station : wi*7);
}

/* ---------- Willkommen ---------- */
function startStation(){
  const saved = savedSess();
  if(saved){ X = saved; X.start = Date.now(); return step(); }
  if(lsGet(LS_SESS)) lsSet(LS_SESS, null);
  const begin = () => { X = planSession(); step(); };
  if((S.round||0) === 0 && S.stationDone.indexOf(S.station) < 0) welcomeScreen(begin); else begin();
}
function welcomeScreen(go){
  view = "welcome";
  const st = curStation(), W = WORLDS[st.world], hr = hero(true);
  hr.append(h("div",{class:"task banner",style:"background:" + W.bg},

/* ---------- Push-Benachrichtigungen ---------- */
async function subscribePush(){
  try{
    const perm = await Notification.requestPermission();
    if(perm !== "granted") return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
    });
    if(currentUser){
      await sb.from("push_subscriptions").upsert({
        user_id: currentUser.id,
        subscription: sub.toJSON(),
        updated_at: new Date().toISOString()
      }, { onConflict: "user_id" });
    }
  }catch(e){ console.error("Push subscription failed:", e); }
}
function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

  items.forEach(s => { s.row = h("div",{class:"muted",text:"wird korrigiert …"}); list.append(h("li",{}, h("div",{}, h("b",{text:s.label}), ": " + s.text), s.row)); });
  box.append(h("p",{class:"h2",text:"Deine Sätze"}), list);
  const fallback = () => items.forEach(s => { s.row.textContent = "Zum Vergleich: " + s.ex; });

  // Try Supabase Edge Function (OpenAI)
  if(currentUser){
    try{
      const { data: { session: authSession } } = await sb.auth.getSession();
      if(authSession){
        const entries = items.map((s,i) => ({i, aufgabe:s.ctx, satz:s.text}));
        const res = await fetch(SB_URL + "/functions/v1/openai-proxy", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authSession.access_token, "apikey": SB_KEY },
          body: JSON.stringify({ action: "correct", payload: { entries } })
        });
        if(res.ok){
          const json = await res.json();
          const arr = (json && json.results) || [];
          items.forEach((s,i) => {
            const r = arr.find(x => x && x.i === i); if(!r){ s.row.textContent = "Zum Vergleich: " + s.ex; return; }
            s.row.replaceChildren(h("div",{class:"fb " + (r.ok ? "ok" : "bad"),style:"margin-top:6px"}, icon(r.ok ? I_OK : I_X),
              h("div",{}, h("b",{text: r.ok ? "Passt" : "Besser so"}), r.ok ? null : h("span",{text:String(r.korrektur || "")}), r.hinweis ? h("div",{class:"muted",text:String(r.hinweis)}) : null)));
          });
          return;
        }
      }
    }catch(e){ console.error("Correction error:", e); }
  }
  // Fallback: show example sentences
  box.append(h("div",{class:"muted",text:"Korrektur nur mit Konto verfügbar. Vergleich deine Sätze mit den Beispielen."}));
  fallback();
}

/* ---------- Init ---------- */
async function init(){
  // Register service worker
  if("serviceWorker" in navigator){
    try{ await navigator.serviceWorker.register("sw.js"); }catch(e){}
  }

  // Check auth state
  const { data: { session } } = await sb.auth.getSession();
  if(session){ currentUser = session.user; await syncFromCloud(); }

  // Listen for auth changes (magic link callback)
  sb.auth.onAuthStateChange(async (event, session) => {
    if(event === "SIGNED_IN" && session){
      currentUser = session.user;
      await syncFromCloud();
      // Auto-subscribe to push after login
      if("PushManager" in window && Notification.permission === "default"){
        // Don't auto-ask, let them do it from settings
      }
      home();
    }
    if(event === "SIGNED_OUT"){ currentUser = null; }
  });

  home();
}
init();
</script>
